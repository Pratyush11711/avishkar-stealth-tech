name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Load the EC2 key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/avishkar.pem
          chmod 600 ~/.ssh/avishkar.pem
          ssh-keyscan -H ec2-13-235-150-112.ap-south-1.compute.amazonaws.com >> ~/.ssh/known_hosts

      - name: Upload source, then install, build, and restart
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            -e 'ssh -i ~/.ssh/avishkar.pem -o StrictHostKeyChecking=yes' \
            ./ ubuntu@ec2-13-235-150-112.ap-south-1.compute.amazonaws.com:/tmp/stealthtech-src/
          ssh -i ~/.ssh/avishkar.pem -o StrictHostKeyChecking=yes \
            ubuntu@ec2-13-235-150-112.ap-south-1.compute.amazonaws.com \
            "sudo bash -lc 'set -euo pipefail; rsync -a --delete --exclude node_modules/ --exclude dist/ --exclude .git/ /tmp/stealthtech-src/ /root/stealthtech.agency/; rm -rf /tmp/stealthtech-src; cd /root/stealthtech.agency; npm install; npm run build; pm2 restart stealthtech.agency'"
